# Copy to .github/workflows/dependency-maintenance.yml and set the vars named below.
name: Dependency maintenance

on:
  schedule:
    - cron: "33 22 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.MAINTENANCE_WIF_PROVIDER }}
          service_account: ${{ vars.MAINTENANCE_READ_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: kouariga/dependency-integration/scan-cloud-run@v1
        with:
          project: ${{ vars.MAINTENANCE_GCP_PROJECT }}
          region: ${{ vars.MAINTENANCE_GCP_REGION }}
          output-dir: maintenance-scan
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-security-${{ github.run_attempt }}
          path: maintenance-scan/
          if-no-files-found: warn
          retention-days: 30

  report:
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kouariga/dependency-integration/report@v1
        with:
          config: .github/maintenance.json
          artifact-pattern: deployed-security-*
          artifact-dir: maintenance-artifacts
          extras: maintenance-artifacts/report.json
          job-results: scan=${{ needs.scan.result }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-maintenance-${{ github.run_attempt }}
          path: maintenance-report.json
          if-no-files-found: warn
          retention-days: 30
