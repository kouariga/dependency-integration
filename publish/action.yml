name: Publish dependency integration
description: Push the bundle from the build job and open the integration PR as the token owner. Runs no repository code.
inputs:
  token:
    description: Fine-grained PAT with Contents, Pull requests, and Workflows read and write.
    required: true
  artifact-name:
    description: Name of the artifact uploaded by the build action.
    default: dependency-integration
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/dependency-integration
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ARTIFACT_DIR: ${{ runner.temp }}/dependency-integration
      run: python3 "$GITHUB_ACTION_PATH/../integrate.py" publish --artifact-dir "$ARTIFACT_DIR"
